framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        default_bus: command.bus

        buses:
            command.bus:
                # Order matters: the domain-event middleware wraps doctrine_transaction
                # so buffered events are released only after the transaction commits.
                middleware:
                    # Buffer domain events and publish them after the commit (discard on rollback).
                    - App\Shared\Infrastructure\Messenger\DomainEventTransactionMiddleware
                    # Wrap every command handler in a single Doctrine transaction so a
                    # use case touching more than one aggregate (e.g. advancing a
                    # FlightOccurrence and creating its Announcement) commits atomically.
                    - doctrine_transaction
            event.bus:
                default_middleware: allow_no_handlers
            # Outbound integration commands to other services. No doctrine_transaction:
            # they are published after the local transaction has already committed, so
            # sending must not open a new transaction or depend on the database.
            integration.bus:
                default_middleware: allow_no_handlers

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Outbound integration commands to aeroflow-playback travel over RabbitMQ.
            # JSON-serialized so the consuming service is not coupled to Core's classes.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
            # Inbound integration events from aeroflow-playback (queued / started /
            # completed). The custom serializer rebuilds the message from the JSON
            # body discriminated by the `event` field, so core is not coupled to
            # playback's PHP classes.
            playback_events:
                dsn: '%env(MESSENGER_PLAYBACK_EVENTS_DSN)%'
                serializer: App\Announcements\Infrastructure\Integration\Playback\PlaybackEventSerializer
                retry_strategy:
                    max_retries: 3
                    delay: 1000
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Core publishes this to aeroflow-playback after the local transaction commits.
            App\Announcements\Application\Playback\RequestAnnouncementPlayback: async

when@test:
    framework:
        messenger:
            transports:
                # Keep the outbound transport in-memory in tests so publishing can be
                # asserted without a running RabbitMQ.
                async: 'in-memory://'
                playback_events: 'in-memory://'
