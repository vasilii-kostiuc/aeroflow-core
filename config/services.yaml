# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    user_access.refresh_token_ttl: '+30 days'
    audio_catalog.storage_directory: '%kernel.project_dir%/var/audio-assets'
    localization.languages:
        -
            code: 'ro-MD'
            name: 'Romanian (Moldova)'
            nativeName: 'Romana'
            active: true
            sortOrder: 1
        -
            code: 'ru'
            name: 'Russian'
            nativeName: 'Русский'
            active: true
            sortOrder: 2
        -
            code: 'en'
            name: 'English'
            nativeName: 'English'
            active: true
            sortOrder: 3

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Shared\Application\Bus\ApplicationBus:
        alias: App\Shared\Infrastructure\Bus\MessengerApplicationBus

    App\Shared\Application\Event\DomainEventPublisher:
        alias: App\Shared\Infrastructure\Event\DeferredDomainEventPublisher

    App\UserAccess\Domain\Repository\UserRepositoryInterface:
        alias: App\UserAccess\Infrastructure\Persistance\Doctrine\UserRepository

    App\UserAccess\Domain\Repository\RefreshTokenRepositoryInterface:
        alias: App\UserAccess\Infrastructure\Persistance\Doctrine\RefreshTokenRepository

    App\UserAccess\Application\Security\AccessTokenIssuerInterface:
        alias: App\UserAccess\Infrastructure\Security\LexikAccessTokenIssuer

    App\UserAccess\Application\Security\RefreshTokenGeneratorInterface:
        alias: App\UserAccess\Infrastructure\Security\RandomRefreshTokenGenerator

    App\UserAccess\Application\Security\RefreshTokenHasherInterface:
        alias: App\UserAccess\Infrastructure\Security\Sha256RefreshTokenHasher

    App\FlightOperations\Domain\Repository\FlightDefinitionRepositoryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\FlightDefinitionRepository

    App\FlightOperations\Application\ListFlightDefinitions\FlightDefinitionListQueryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\DbalFlightDefinitionListQuery

    App\FlightOperations\Domain\Repository\FlightOccurrenceRepositoryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\FlightOccurrenceRepository

    App\FlightOperations\Application\ListFlightOccurrences\FlightOccurrenceListQueryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\DbalFlightOccurrenceListQuery

    App\FlightOperations\Application\Dispatcher\DispatcherFlightOccurrenceQueryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\DbalDispatcherFlightOccurrenceQuery

    App\FlightOperations\Domain\Repository\AirportRepositoryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\AirportRepository

    App\FlightOperations\Domain\Repository\CheckInCounterRepositoryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\CheckInCounterRepository

    App\FlightOperations\Domain\Repository\GateRepositoryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\GateRepository

    App\FlightOperations\Application\ListAirports\AirportListQueryInterface:
        alias: App\FlightOperations\Infrastructure\Persistence\Doctrine\DbalAirportListQuery

    App\Announcements\Domain\Repository\AnnouncementRepositoryInterface:
        alias: App\Announcements\Infrastructure\Persistence\Doctrine\AnnouncementRepository

    App\Announcements\Domain\Repository\FlightAnnouncementConfigRepositoryInterface:
        alias: App\Announcements\Infrastructure\Persistence\Doctrine\FlightAnnouncementConfigRepository

    App\Announcements\Application\Port\FlightOperations\FlightDefinitionLookupInterface:
        alias: App\Announcements\Infrastructure\Integration\FlightOperations\FlightOperationsFlightDefinitionLookup

    App\FlightOperations\Application\Port\Announcements\OccurrenceAnnouncementPort:
        alias: App\FlightOperations\Infrastructure\Integration\Announcements\BusOccurrenceAnnouncements

    App\Announcements\Application\Port\AudioCatalog\AudioPromptLookupInterface:
        alias: App\Announcements\Infrastructure\Integration\AudioCatalog\AudioCatalogAudioPromptLookup

    App\Announcements\Application\Port\FlightOperations\OperationalResourceLookupInterface:
        alias: App\Announcements\Infrastructure\Integration\FlightOperations\FlightOperationsOperationalResourceLookup

    App\Announcements\Application\Playback\PlaybackRequestPublisherInterface:
        alias: App\Announcements\Infrastructure\Integration\Playback\MessengerPlaybackRequestPublisher

    App\Announcements\Application\Playback\PlaybackEventReceiptRecorderInterface:
        alias: App\Announcements\Infrastructure\Integration\Playback\DoctrinePlaybackEventReceiptRecorder

    App\Announcements\Application\Playback\PlaybackEventReceiptReaderInterface:
        alias: App\Announcements\Infrastructure\Integration\Playback\DoctrinePlaybackEventReceiptReader

    App\AudioCatalog\Domain\Repository\AudioAssetRepositoryInterface:
        alias: App\AudioCatalog\Infrastructure\Persistence\Doctrine\AudioAssetRepository

    App\AudioCatalog\Domain\Repository\AudioPromptRepositoryInterface:
        alias: App\AudioCatalog\Infrastructure\Persistence\Doctrine\AudioPromptRepository

    App\AudioCatalog\Application\Storage\AudioAssetStorageInterface:
        alias: App\AudioCatalog\Infrastructure\Storage\LocalAudioAssetStorage

    App\AudioCatalog\Application\Port\Tts\TextToSpeechPort:
        alias: App\AudioCatalog\Infrastructure\Integration\Tts\HttpTextToSpeechAdapter

    App\Localization\Application\LanguageProviderInterface:
        alias: App\Localization\Infrastructure\Config\ConfiguredLanguageProvider

    App\AudioCatalog\Infrastructure\Storage\LocalAudioAssetStorage:
        arguments:
            $storageDirectory: '%audio_catalog.storage_directory%'

    App\AudioCatalog\Infrastructure\Integration\Tts\HttpTextToSpeechAdapter:
        arguments:
            $baseUrl: '%env(TTS_BASE_URL)%'

    App\Localization\Infrastructure\Config\ConfiguredLanguageProvider:
        arguments:
            $languages: '%localization.languages%'

when@test:
    parameters:
        audio_catalog.storage_directory: '%kernel.cache_dir%/audio-assets'
