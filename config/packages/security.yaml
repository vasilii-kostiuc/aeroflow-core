security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\UserAccess\Domain\Entity\User: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_jwt_provider:
            id: App\UserAccess\Infrastructure\Security\JwtUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            stateless: true
            provider: app_jwt_provider
            jwt: ~

    # Administrator can do everything a dispatcher can (task 033).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_DISPATCHER]

    # Only the *first* matching rule is applied. Order: public, then the
    # dispatcher's work, then everything else under /api/v1 for administrators —
    # so a new endpoint is closed to administrators by default, not open to all.
    access_control:
        - { path: ^/api/v1/(login|token/refresh|logout|languages)$, roles: PUBLIC_ACCESS }
        # Any signed-in account, a role or not: the web reads its current role here.
        - { path: ^/api/v1/me$, roles: IS_AUTHENTICATED_FULLY }

        # Dispatcher panel: board, queue, stop, supplementary and emergency announcements.
        - { path: ^/api/v1/dispatcher/, roles: ROLE_DISPATCHER }
        # Dispatcher actions on a flight run and on a queued announcement.
        - { path: '^/api/v1/flight-occurrences:(ensure-manual|start-next-manual)$', roles: ROLE_DISPATCHER, methods: [POST] }
        - { path: '^/api/v1/flight-occurrences/[^/]+/(check-in:open|check-in:close|boarding|arrival)$', roles: ROLE_DISPATCHER, methods: [POST] }
        - { path: ^/api/v1/announcements/[^/]+/cancel$, roles: ROLE_DISPATCHER, methods: [POST] }
        # Reference data the dispatcher panel reads.
        - { path: ^/api/v1/(flight-definitions|airports|flight-occurrences|announcements)(/[^/]+)?$, roles: ROLE_DISPATCHER, methods: [GET] }
        - { path: ^/api/v1/(admin/gates|admin/check-in-counters|flight-announcement-configs/languages)$, roles: ROLE_DISPATCHER, methods: [GET] }

        - { path: ^/api/v1, roles: ROLE_ADMIN }
        # Service-to-service download for the audio agent (task 016). No
        # inter-service auth yet — network-level trust of the local installation,
        # a documented deliberate compromise.
        - { path: ^/internal/v1, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\UserAccess\Domain\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
