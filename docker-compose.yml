services:
  aeroflow_core_app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: aeroflow_core_app
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://aeroflow:aeroflow@aeroflow_core_postgres:5432/aeroflow?serverVersion=16&charset=utf8
    depends_on:
      aeroflow_core_postgres:
        condition: service_healthy
    networks:
      - aeroflow

  aeroflow_core_nginx:
    image: nginx:1.27-alpine
    container_name: aeroflow_core_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./_docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aeroflow_core_app
    networks:
      - aeroflow

  aeroflow_core_postgres:
    image: postgres:16-alpine
    container_name: aeroflow_core_postgres
    environment:
      POSTGRES_DB: aeroflow
      POSTGRES_USER: aeroflow
      POSTGRES_PASSWORD: aeroflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aeroflow -d aeroflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeroflow

networks:
  aeroflow:
    driver: bridge

volumes:
  postgres_data:
