services:
  aeroflow_core_app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: aeroflow_core_app
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://aeroflow:aeroflow@aeroflow_core_postgres:5432/aeroflow?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@aeroflow_core_rabbitmq:5672/%2f/announcement_playback
      MESSENGER_PLAYBACK_EVENTS_DSN: amqp://guest:guest@aeroflow_core_rabbitmq:5672/%2f/playback_events
    depends_on:
      aeroflow_core_postgres:
        condition: service_healthy
      aeroflow_core_rabbitmq:
        condition: service_healthy
    networks:
      - aeroflow

  # Consumes the integration events published back by aeroflow-playback
  # (queued/started/completed) and records their receipts. Long-running
  # messenger worker: a separate process from PHP-FPM by design.
  aeroflow_core_worker:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: aeroflow_core_worker
    command: php bin/console messenger:consume playback_events -vv
    restart: unless-stopped
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://aeroflow:aeroflow@aeroflow_core_postgres:5432/aeroflow?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@aeroflow_core_rabbitmq:5672/%2f/announcement_playback
      MESSENGER_PLAYBACK_EVENTS_DSN: amqp://guest:guest@aeroflow_core_rabbitmq:5672/%2f/playback_events
    depends_on:
      aeroflow_core_postgres:
        condition: service_healthy
      aeroflow_core_rabbitmq:
        condition: service_healthy
    networks:
      - aeroflow

  aeroflow_core_nginx:
    image: nginx:1.27-alpine
    container_name: aeroflow_core_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./_docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aeroflow_core_app
    networks:
      - aeroflow

  aeroflow_core_postgres:
    image: postgres:16-alpine
    container_name: aeroflow_core_postgres
    environment:
      POSTGRES_DB: aeroflow
      POSTGRES_USER: aeroflow
      POSTGRES_PASSWORD: aeroflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aeroflow -d aeroflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeroflow

  aeroflow_core_rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aeroflow_core_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # 5672 AMQP, 15672 management UI. Exposed so aeroflow-playback can share
      # the same broker during local development.
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeroflow

networks:
  aeroflow:
    driver: bridge

volumes:
  postgres_data:
